name: Agent Fix Phase Publisher Script

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

env:
  FIX_PARENT_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  fix:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cloud-fox-studio-v0610' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_PARENT_SHA }}
          fetch-depth: 0

      - name: Add removed-workflow exclusion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIX_PARENT_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/agent-publish-de.sh')
          source = path.read_text()
          marker = "  ':(exclude).github/workflows/agent-export-snapshot.yml' \\\n"
          addition = marker + "  ':(exclude).github/workflows/agent-inspect-blobs.yml' \\\n"
          if "':(exclude).github/workflows/agent-inspect-blobs.yml'" in source:
              print('Publisher script already fixed.')
          else:
              if source.count(marker) != 1:
                  raise RuntimeError(f'exclusion marker count: {source.count(marker)}')
              path.write_text(source.replace(marker, addition, 1))
          PY
          if git diff --quiet -- scripts/agent-publish-de.sh; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/agent-publish-de.sh
          git commit -m 'chore(ci): fix phases D-E parent verification'
          git push origin HEAD:refs/heads/agent/cloud-fox-studio-v0610
