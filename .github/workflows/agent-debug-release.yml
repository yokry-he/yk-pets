name: Agent Debug Phase Release

on:
  pull_request:
    types:
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  debug:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cloud-fox-studio-v0610' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download failed self-fix logs
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '89656678776'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_JOB_ID/logs" \
            --output /tmp/failed-job.log
          {
            echo '=== ERROR MATCHES ==='
            grep -nEi '(^|[^a-z])(error|failed|failure|RuntimeError|Traceback|fatal|YAML|refusing)([^a-z]|$)' /tmp/failed-job.log | tail -n 120 || true
            echo
            echo '=== LAST 180 LINES ==='
            tail -n 180 /tmp/failed-job.log
          } > /tmp/self-fix-error.txt
          cat /tmp/self-fix-error.txt
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: self-fix-error
          path: /tmp/self-fix-error.txt
          retention-days: 1
