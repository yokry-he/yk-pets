name: Agent Debug Phase Release

on:
  push:
    branches:
      - agent/cloud-fox-studio-v0610

permissions:
  actions: read
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download failed publish logs
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '89655258767'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_JOB_ID/logs" \
            --output /tmp/failed-job.log
          {
            echo '=== ERROR MATCHES ==='
            grep -nEi '(^|[^a-z])(error|failed|failure|ERR_|ELIFECYCLE|TS[0-9]{4})([^a-z]|$)' /tmp/failed-job.log | tail -n 160 || true
            echo
            echo '=== LAST 260 LINES ==='
            tail -n 260 /tmp/failed-job.log
          } > /tmp/release-error.txt
          cat /tmp/release-error.txt
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase-release-error
          path: /tmp/release-error.txt
          retention-days: 1
