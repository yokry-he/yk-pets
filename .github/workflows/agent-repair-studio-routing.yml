name: Agent Repair Studio Routing

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

env:
  REPAIR_PARENT_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  repair:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cloud-fox-studio-v0610' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repair parent
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_PARENT_SHA }}
          fetch-depth: 0

      - name: Apply Studio routing repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIR_PARENT_SHA"
          python - <<'PY'
          from pathlib import Path
          import json

          app = Path('apps/playground/app/app.vue')
          source = app.read_text()
          marker = '  <NuxtPage />\n  <NuxtLink'
          replacement = '  <NuxtLayout>\n    <NuxtPage />\n  </NuxtLayout>\n  <NuxtLink'
          if source.count(marker) != 1:
              raise RuntimeError(f'app layout marker count: {source.count(marker)}')
          app.write_text(source.replace(marker, replacement, 1))

          legacy_parent = Path('apps/playground/app/pages/studio.vue')
          legacy_index = Path('apps/playground/app/pages/studio/index.vue')
          if not legacy_parent.exists() or legacy_index.exists():
              raise RuntimeError('unexpected Studio redirect file layout')
          redirect = legacy_parent.read_text()
          redirect = redirect.replace(
              '将旧 `/studio` 入口兼容跳转到新的外观工坊路由，避免历史链接失效。',
              '仅在精确 `/studio` 索引路由兼容跳转到外观工坊，避免父路由遮蔽 `/studio/*` 子页面。',
          ).replace(
              'Redirects the legacy `/studio` entry to the new appearance workspace so existing links remain valid.',
              'Redirects only the exact `/studio` index route so it cannot shadow the `/studio/*` workspace pages.',
          )
          legacy_index.write_text(redirect)
          legacy_parent.unlink()

          config = Path('apps/playground/nuxt.config.ts')
          source = config.read_text()
          marker = "  modules: [\n    '@pinia/nuxt',\n  ],\n\n"
          replacement = marker + "  pinia: {\n    storesDirs: [],\n  },\n\n"
          if source.count(marker) != 1:
              raise RuntimeError(f'Nuxt Pinia marker count: {source.count(marker)}')
          config.write_text(source.replace(marker, replacement, 1))

          gate = Path('scripts/check-studio-workspace-shell.mjs')
          source = gate.read_text()
          replacements = [
              ("import { readFileSync } from 'node:fs'", "import { existsSync, readFileSync } from 'node:fs'"),
              ("const domain = read('apps/playground/app/domain/studio-workspace.ts')", "const app = read('apps/playground/app/app.vue')\nconst nuxtConfig = read('apps/playground/nuxt.config.ts')\nconst domain = read('apps/playground/app/domain/studio-workspace.ts')"),
              ("const legacy = read('apps/playground/app/pages/studio.vue')", "const legacy = read('apps/playground/app/pages/studio/index.vue')\nconst legacyParentExists = existsSync(new URL('../apps/playground/app/pages/studio.vue', import.meta.url))"),
              ("  ['shared shell owns navigation and context jumps'", "  ['Nuxt root renders routed pages through layouts', app.includes('<NuxtLayout>') && app.includes('<NuxtPage />') && app.indexOf('<NuxtLayout>') < app.indexOf('<NuxtPage />') && app.indexOf('</NuxtLayout>') > app.indexOf('<NuxtPage />')],\n  ['explicit Store imports disable Pinia store auto-scan', nuxtConfig.includes('pinia: {') && nuxtConfig.includes('storesDirs: []')],\n  ['shared shell owns navigation and context jumps'"),
              ("  ['legacy Studio URL redirects to appearance', legacy.includes(\"navigateTo('/studio/appearance'\") && legacy.includes('replace: true')],", "  ['legacy Studio URL redirects from index only', !legacyParentExists && legacy.includes(\"navigateTo('/studio/appearance'\") && legacy.includes('replace: true')],"),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError(f'gate marker count for {old!r}: {source.count(old)}')
              source = source.replace(old, new, 1)
          gate.write_text(source)

          state_path = Path('.ai/project-state.json')
          state = json.loads(state_path.read_text())
          state['architecture']['studioRouteRenderingComplete'] = True
          state['architecture']['piniaStoreAutoScanDisabled'] = True
          for item in [
              'studio-nested-route-loop-repair',
              'nuxt-layout-root-rendering',
              'pinia-duplicate-store-import-warning-removal',
          ]:
              if item not in state['completed']:
                  state['completed'].append(item)
          state['latestCompletedBatch'] = {
              'id': 'studio-route-runtime-repair',
              'domainPackage': 'apps/playground',
              'rendererModified': False,
              'visualCasesModified': False,
              'automatedCoverage': [
                  'studio-index-only-redirect',
                  'nuxt-layout-root-rendering',
                  'pinia-store-autoscan-disabled',
                  'studio-child-route-non-shadowing',
              ],
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n')

          zh = Path('docs/zh-CN/KNOWN-ISSUES.md')
          source = zh.read_text()
          note = """## STUDIO-001：Studio 子路由自跳转循环已修复，需浏览器复验\n\n- 状态：Implemented; browser recheck required\n- 根因：`pages/studio.vue` 同时成为 `/studio/*` 父路由并无条件跳转到 `/studio/appearance`，导致外观页反复导航；根 `app.vue` 又未渲染 `NuxtLayout`，警告随循环重复。\n- 修复：重定向移动到 `pages/studio/index.vue`，根应用恢复 `NuxtLayout`，并关闭已由显式导入替代的 Pinia Store 自动扫描。\n- 复验：重新启动开发服务器后确认四个 Studio 路由可直接进入、控制台不再重复输出布局与 `actions` 导入警告。\n\n"""
          header = '# 已知问题与未完成边界\n\n'
          if source.count(header) != 1 or '## STUDIO-001' in source:
              raise RuntimeError('unexpected Chinese known-issues structure')
          zh.write_text(source.replace(header, header + note, 1))

          en = Path('docs/en/KNOWN-ISSUES.md')
          source = en.read_text()
          note = """## STUDIO-001: Studio child-route self-redirect loop is fixed; browser recheck remains\n\n- Status: Implemented; browser recheck required\n- Root cause: `pages/studio.vue` became the parent of every `/studio/*` route while unconditionally navigating to `/studio/appearance`; root `app.vue` also omitted `NuxtLayout`, so the layout warning repeated with the loop.\n- Fix: move the redirect to `pages/studio/index.vue`, restore `NuxtLayout` at the app root, and disable Pinia Store auto-scanning because all stores are explicitly imported.\n- Recheck: restart the dev server, open all four Studio routes directly, and confirm the repeated layout and duplicate `actions` import warnings are gone.\n\n"""
          header = '# Known Issues and Incomplete Boundaries\n\n'
          if source.count(header) != 1 or '## STUDIO-001' in source:
              raise RuntimeError('unexpected English known-issues structure')
          en.write_text(source.replace(header, header + note, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .ai/project-state.json \
            apps/playground/app/app.vue \
            apps/playground/app/pages/studio.vue \
            apps/playground/app/pages/studio/index.vue \
            apps/playground/nuxt.config.ts \
            docs/zh-CN/KNOWN-ISSUES.md \
            docs/en/KNOWN-ISSUES.md \
            scripts/check-studio-workspace-shell.mjs
          git commit -m 'fix(studio): repair nested workspace routing'

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm check:brand
          pnpm check:cloud-fox-studio
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm build:playground
          git diff --exit-code

      - name: Push validated repair
        shell: bash
        run: |
          set -euo pipefail
          current_remote="$(git ls-remote origin refs/heads/agent/cloud-fox-studio-v0610 | cut -f1)"
          test "$current_remote" = "$REPAIR_PARENT_SHA"
          git push origin HEAD:refs/heads/agent/cloud-fox-studio-v0610
          git rev-parse HEAD | tee /tmp/studio-routing-repair-sha.txt

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-routing-repair-report
          path: /tmp/studio-routing-repair-sha.txt
          if-no-files-found: warn
          retention-days: 3
