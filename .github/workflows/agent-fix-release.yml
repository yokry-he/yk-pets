name: Agent Fix Phase Release

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

env:
  RELEASE_PARENT_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  fix:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cloud-fox-studio-v0610' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_PARENT_SHA }}
          fetch-depth: 0
      - name: Fix publish workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_PARENT_SHA"
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-inspect-blobs.yml')
          lines = workflow.read_text().splitlines()

          def find_line(fragment: str) -> int:
              matches = [index for index, line in enumerate(lines) if fragment in line]
              if len(matches) != 1:
                  raise RuntimeError(f'expected one line containing {fragment!r}, found {len(matches)}')
              return matches[0]

          exclusion_index = find_line("':(exclude).github/workflows/agent-inspect-blobs.yml'")
          exclusion_indent = lines[exclusion_index][:len(lines[exclusion_index]) - len(lines[exclusion_index].lstrip())]
          if not lines[exclusion_index].rstrip().endswith('\\'):
              lines[exclusion_index] = lines[exclusion_index] + ' \\'
          lines.insert(exclusion_index + 1, exclusion_indent + "':(exclude).github/workflows/agent-debug-release.yml'")

          apply_index = find_line('git apply --index --whitespace=error-all /tmp/yk-pets-release/phase-B.patch')
          apply_indent = lines[apply_index][:len(lines[apply_index]) - len(lines[apply_index].lstrip())]
          fix_block = [
              apply_indent + "python - <<'PY_FIX_B'",
              apply_indent + 'from pathlib import Path',
              apply_indent + '',
              apply_indent + "path = Path('apps/playground/app/stores/studio-motion-editor.ts')",
              apply_indent + 'source = path.read_text()',
              apply_indent + 'replacements = [',
              apply_indent + '    (',
              apply_indent + "        '    apply(asset: StudioMotionAssetV2, selectedKeyframeIds = this.selectedKeyframeIds) {',",
              apply_indent + "        '    apply(asset: StudioMotionAssetV2, selectedKeyframeIds?: string[]) {',",
              apply_indent + '    ),',
              apply_indent + '    (',
              apply_indent + "        '      this.selectedKeyframeIds = selectedKeyframeIds',",
              apply_indent + "        '      this.selectedKeyframeIds = selectedKeyframeIds ?? this.selectedKeyframeIds',",
              apply_indent + '    ),',
              apply_indent + '    (',
              apply_indent + "        '    setPlayhead(timeMs: number, snap = this.snapToFrames) {',",
              apply_indent + "        '    setPlayhead(timeMs: number, snap?: boolean) {',",
              apply_indent + '    ),',
              apply_indent + '    (',
              apply_indent + "        '      if (!snap) this.playheadTimeMs = raw',",
              apply_indent + "        '      const shouldSnap = snap ?? this.snapToFrames\\n      if (!shouldSnap) this.playheadTimeMs = raw',",
              apply_indent + '    ),',
              apply_indent + ']',
              apply_indent + 'for old, new in replacements:',
              apply_indent + '    if source.count(old) != 1:',
              apply_indent + "        raise RuntimeError(f'phase B typing marker count for {old!r}: {source.count(old)}')",
              apply_indent + '    source = source.replace(old, new, 1)',
              apply_indent + 'path.write_text(source)',
              apply_indent + 'PY_FIX_B',
              apply_indent + 'git add apps/playground/app/stores/studio-motion-editor.ts',
          ]
          lines[apply_index + 1:apply_index + 1] = fix_block

          cleanup_index = find_line('git rm .github/workflows/agent-inspect-blobs.yml')
          cleanup_indent = lines[cleanup_index][:len(lines[cleanup_index]) - len(lines[cleanup_index].lstrip())]
          lines.insert(cleanup_index + 1, cleanup_indent + 'git rm .github/workflows/agent-debug-release.yml')

          workflow.write_text('\n'.join(lines) + '\n')
          PY
          git rm .github/workflows/agent-fix-release.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/agent-inspect-blobs.yml
          git commit -m 'chore(ci): fix phase B release typing'
          git push origin HEAD:refs/heads/agent/cloud-fox-studio-v0610
