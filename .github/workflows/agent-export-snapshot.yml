name: Agent Phase Publisher

on:
  push:
    branches:
      - agent/cloud-fox-studio-v0610

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore(agent): publish phase B'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply verified Phase B patch
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB: 9fc3e7cb6b35cd74225386bb8d363d5c679dc71b
          PATCH_SHA256: 0467d6d3597b9b8c7db7b1997f3637009f0eac88bb57ef53b884ae54e6126315
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{os.environ['PATCH_BLOB']}"
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as response: payload=json.load(response)
          data=base64.b64decode(payload['content'])
          actual=hashlib.sha256(data).hexdigest()
          if actual != os.environ['PATCH_SHA256']: raise RuntimeError(f'patch mismatch: {actual}')
          open('/tmp/phase-b.patch.gz','wb').write(data)
          PY
          gzip -dc /tmp/phase-b.patch.gz > /tmp/phase-b.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --3way /tmp/phase-b.patch
          test "$(git show --format= --name-only HEAD | grep -E '^(apps|packages)/' | wc -l)" -gt 0
          git show --format= --name-only HEAD | grep -Fx '.ai/project-state.json'
          git show --format= --name-only HEAD | grep -E '^docs/(zh-CN|en)/adr/0005-'

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check brand and Studio contract
        run: |
          pnpm check:brand
          pnpm check:cloud-fox-studio

      - name: Typecheck workspaces
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build Local Agent and extension
        run: pnpm build

      - name: Build Playground
        run: pnpm build:playground

      - name: Push validated Phase B commit
        run: git push origin HEAD:refs/heads/agent/cloud-fox-studio-v0610
