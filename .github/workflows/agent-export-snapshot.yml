name: Agent Export Snapshot

on:
  push:
    branches:
      - agent/cloud-fox-studio-v0610
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Create source snapshot
        run: |
          git rev-parse HEAD > /tmp/yk-pets-export-head.txt
          git rev-parse 'HEAD^{tree}' > /tmp/yk-pets-export-tree.txt
          tar --exclude=.git --exclude=node_modules --exclude=.nuxt --exclude=.output --exclude=.wxt -czf /tmp/yk-pets-source-snapshot.tar.gz .

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: yk-pets-source-snapshot
          path: |
            /tmp/yk-pets-source-snapshot.tar.gz
            /tmp/yk-pets-export-head.txt
            /tmp/yk-pets-export-tree.txt
          if-no-files-found: error
          retention-days: 1
