name: Agent Export Current Source

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

jobs:
  export:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cloud-fox-studio-v0610' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/yk-pets-current-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/yk-pets-current-head.txt
          sha256sum /tmp/yk-pets-current-source.tar.gz > /tmp/yk-pets-current-source.sha256
      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: yk-pets-current-source
          path: |
            /tmp/yk-pets-current-source.tar.gz
            /tmp/yk-pets-current-head.txt
            /tmp/yk-pets-current-source.sha256
          retention-days: 1
