name: Validate YK-PETS

on:
  push:
    branches:
      - agent/yk-pets-rebrand-v0610
      - agent/cloud-fox-studio-v0610
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reconstruct motion-domain batch
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_SHA256: 5bed7417d8a964d1f60d336d87341c6dee69a08b07feea2e83fe2e3e3c0d91ea
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import tarfile
          import urllib.request
          from pathlib import Path

          parts = [
              ('43809e288c5e8d49305a25d9093f8f6de7b743f1', '785b629739c6d57337556c7a41d5db14eb5123709cbf558da9cfa45dfe91241f'),
              ('989148a667251fe421e11d25f166922f1ab02c25', '21666c30273cf3a458cb092f17b9400f58c4c60919d55e7969fe1ab0fd6e6e1a'),
              ('25b8804b0930029ed933ad0fa7159adab6d9e335', '39a33ca599a92ca9e515d978a001d5e97c1e32e02d647e6a389fc225a32d7da0'),
              ('2d925699413e1cc8dc44def20e4b71ebb62694fe', '2133793d949e17cdaa362feb1e1eb6de64a6d0fa5e6306f6b3f0665dca91010c'),
              ('04c6761f061134cb068f442bfaceb31abcee4dd5', '3e063a7bdaa7501300428aaa4006c6b583f827535fb3cf907a53e66ecadd9803'),
              ('47b265bbf5c88c8f25339c0570c58bdbb37bd9ea', 'eceba915fcce4634750006580795502dea147450036ffe48db9184c935d6af2d'),
              ('7a382fd545604d16b16960870e9fa3ac82325a8c', '902bad0d98cf5abdfb722a911410beb2dd8de0632912dc95df2a686ea0e4f335'),
              ('21266310333fff9a6f5ba1864d61b43a79045ce4', '8261d1c32565c85144b1352599e83e89f1944dce4c3de3b9a4bceb747fe7c13e'),
              ('dfa453e355333fe86a293e6460d3ab630f4c92d0', '91b7a6f061d7cc09da16f35845045c023ef5455526012a9aab072231ab6771f6'),
              ('d6921ef82a7a4b0b8f5eb840d8b5aa4614bd1625', '669402be74580e47913f6b80c2555bbfe963823fda8b447bc0963edeb315987d'),
              ('f1ba1a89a82fff3a688e0e3343d80cac19f3cc0a', 'a522245f633c934f72b09328d1fb9cd1039c515685a7c909ac61fe2ef5e8b1ba'),
              ('e3a27effc8abffe46a9020b63db1d84830c503cf', '747d766b71d31102d335c11ad292c8831df4eb97bd65bdf5ad3013f87b232877'),
              ('cceb4d1766e900f8d066029c586068035490f6f1', 'd351a17fc7e564fc1bd4419d6937d49752a78d4d2f95ca56243db12324bcb3e7'),
              ('82fa259c7b442ec876b31f7375f4059d27da529f', 'aafa22c21b3f3bff556d63c7c0f52dd2427196df263a43066dfecafbd53ce4dc'),
              ('23a6f71befca5b6438009a4f7d6f9ee588e0f28b', '5454a3be34153355f9f6131baa3d930243bcff22f7d954108fc61a8ba4ced56f'),
              ('431dda72a8c13454b497bd5199c3e94203ddc0af', '2c6b6c31bed5d222b62371931b2dea7085f62de3aa6ec073d57c0df6df3bf595'),
              ('13634bb95f0aba85659c59bf576a095690915936', '436e25e4720fb2857410e454e017f857e758c575ae8996382865b954b33b9981'),
              ('925561c831e8933b150d6950f59bb8d21684c07c', '66173f8ef91f4c37d500a13ea33a5d37209c5300295dc07eae98eba25d9963a9'),
              ('28c04dc050c618f4bac50c349fdaa274eb78f599', 'e46886e32f4ada590d84e6dd8fafa85176d1d4a653b7cc77694c9f98f6d48772'),
              ('bd2d848ff1aa463f846aed79b92ae9b811d7bcae', '1fc77009570babf01b25040889111cb787c641aec31386f652e2d709d1993575'),
              ('3d348ef7bff0f326933aa8096fd77a206141fd9b', 'cf9e5da3a712a7a9e7b96734fe759bbced982a63ededf56f7dc58bc30f1d4848'),
              ('612258ea11fdca1090ba43763ec6e231cd11b17f', 'f556229167f0fff11d8a8063bbf91691ff6f04a14296738fdf30a17002f6bb01'),
          ]
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          encoded = bytearray()
          for blob_sha, expected in parts:
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{blob_sha}"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  payload = json.load(response)
              fragment = base64.b64decode(payload['content'])
              actual = hashlib.sha256(fragment).hexdigest()
              if actual != expected:
                  raise RuntimeError(f'fragment {blob_sha} expected {expected} got {actual}')
              encoded.extend(fragment)
          archive = base64.b64decode(bytes(encoded), validate=True)
          actual_bundle = hashlib.sha256(archive).hexdigest()
          if actual_bundle != os.environ['BUNDLE_SHA256']:
              raise RuntimeError(f"bundle expected {os.environ['BUNDLE_SHA256']} got {actual_bundle}")
          archive_path = Path('/tmp/yk-pets-motion-domain-bundle.tar.gz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, 'r:gz') as bundle:
              bundle.extractall('.')
          manifest = Path('.__yk_bundle_manifest').read_text().splitlines()
          if len(manifest) != 25:
              raise RuntimeError(f'expected 25 feature paths, got {len(manifest)}')
          Path('/tmp/yk-pets-feature-manifest').write_text('\n'.join(manifest) + '\n')
          Path('.__yk_bundle_manifest').unlink()
          print(f'Reconstructed {len(manifest)} feature paths from {len(parts)} verified fragments.')
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check YK-PETS brand and identity
        run: pnpm check:brand

      - name: Check Cloud Fox Studio contract
        run: pnpm check:cloud-fox-studio

      - name: Typecheck workspaces
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build Local Agent and extension
        run: pnpm build

      - name: Build Playground
        run: pnpm build:playground

      - name: Create unattached atomic feature commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          parent_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse 'HEAD^{tree}')"
          tree_entries='[]'
          while IFS= read -r path
          do
            encoded="$(base64 -w 0 "$path")"
            blob_sha="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}' | curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api/git/blobs" --data-binary @- | jq -er '.sha')"
            tree_entries="$(jq --arg path "$path" --arg sha "$blob_sha" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' <<< "$tree_entries")"
          done < /tmp/yk-pets-feature-manifest
          tree_sha="$(jq -n --arg base_tree "$base_tree" --argjson tree "$tree_entries" '{base_tree:$base_tree,tree:$tree}' | curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api/git/trees" --data-binary @- | jq -er '.sha')"
          commit_sha="$(jq -n --arg message 'feat(motion): add semantic rig and keyframe domain' --arg tree "$tree_sha" --arg parent "$parent_sha" '{message:$message,tree:$tree,parents:[$parent]}' | curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api/git/commits" --data-binary @- | jq -er '.sha')"
          printf '%s\n' "$commit_sha" > /tmp/yk-pets-feature-commit.txt

      - name: Upload atomic feature commit
        uses: actions/upload-artifact@v4
        with:
          name: yk-pets-feature-commit
          path: /tmp/yk-pets-feature-commit.txt
          if-no-files-found: error
          retention-days: 1
